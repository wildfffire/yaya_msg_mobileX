distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 走腾讯云镜像：services.gradle.org 在部分网络下 TCP 能通但 TLS/HTTP 流会超时
#（实测 wrapper 报 "Downloading ... failed: timeout (10000ms)"）。
# 该镜像与官方发行版内容一致，且本机 GRADLE_USER_HOME 里已有它对应的缓存，直接复用不再下载。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
